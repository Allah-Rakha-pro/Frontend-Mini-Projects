<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Start Your Knowledge With These Fun Questions</p>
            <button id="start-btn">Start Quiz</button>
        </div>
        <div class="screen" id="quiz-screen">
            <div class="quiz-heading">
                <h2 id="question-text">Question Goes Here</h2>

                <div class="question-info">
                    <p>
                        Question
                        <span id="current-question">1</span>
                        of
                        <span id="total-question"></span>
                    </p>
                    <p>
                        Score:
                        <span id="score">0</span>
                    </p>
                </div>
            </div>
            <div id="answers-container" class="answers-container">
                <button class="answer-btn">One</button>
                <button class="answer-btn correct">Two</button>
                <button class="answer-btn incorrect">Three</button>
                <button class="answer-btn">Four</button>
                <!-- Answer buttons will be inserted here from our JS code -->
            </div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>
        <div id="result-screen" class="screen">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>
                    You scored
                    <span id="final-score">0</span>
                    out of
                    <span id="max-score">10</span>
                </p>
                <div id="result-message">
                    Good Job!
                </div>
            </div>
            <button id="restart-btn">
                Restart Quiz
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
